name: Auto Generate Sitemap

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-sitemap:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate sitemap.xml
        uses: cicirello/generate-sitemap@v1
        with:
          base-url-path: https://rivieradiulisseindanza.com/
          file-path: .
          sitemap-filename: sitemap.xml
          include-html: true
          changefreq: weekly
          priority: 0.8

      - name: Commit sitemap if changed
        run: |
          if [[ -n "$(git status --porcelain sitemap.xml)" ]]; then
            git config --global user.name "github-actions"
            git config --global user.email "actions@github.com"
            git add sitemap.xml
            git commit -m "Auto-update sitemap"
            git push
          else
            echo "No sitemap changes detected"
          fi
